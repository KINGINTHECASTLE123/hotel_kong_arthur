version: "3.9"

x-common-env: &common_env
  DB_HOST: host.docker.internal 
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  PYTHONUNBUFFERED: "1"

services:
  # API Gateway
  api_gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    ports:
      - "5050:5000"
    environment:
      <<: *common_env
      BOOKING_SERVICE_URL: http://booking_service:5001
      DRINKS_SERVICE_URL:  http://drinks_service:5002
      GUEST_SERVICE_URL:   http://guest_service:5003
      ROOM_SERVICE_URL:    http://room_service:5004
    depends_on:
      - booking_service
      - drinks_service
      - guest_service
      - room_service
    networks:
      - hotel_net

  # Booking Service
  booking_service:
    build:
      context: .
      dockerfile: booking_service/Dockerfile
    ports:
      - "5001:5001"
    environment: *common_env
    networks:
      - hotel_net

  # Drinks Service
  drinks_service:
    build:
      context: .
      dockerfile: drinks_service/Dockerfile
    ports:
      - "5002:5002"
    environment: *common_env
    networks:
      - hotel_net

  # Guest Service
  guest_service:
    build:
      context: .
      dockerfile: guest_service/Dockerfile
    ports:
      - "5003:5003"
    environment: *common_env
    networks:
      - hotel_net

  # Room Service
  room_service:
    build:
      context: .
      dockerfile: room_service/Dockerfile
    ports:
      - "5004:5004"
    environment: *common_env
    networks:
      - hotel_net

  # Streamlit UI
  streamlit_ui:
    build:
      context: ./streamlit_ui
      dockerfile: Dockerfile
    ports:
      - "8520:8520"
    environment:
      GATEWAY_URL: http://api_gateway:5000
    depends_on:
      - api_gateway
    networks:
      - hotel_net

networks:
  hotel_net: